[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zume-assets"
version = "0.1.0"
description = "Regenerate offline Zúme training assets from live zume6 APIs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "qrcode[pil]>=8.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
zume-assets = "zume_assets.cli:main"

[tool.setuptools.packages.find]
include = ["zume_assets*"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["zume_assets", "tests", "build.py"]
extend-exclude = ["slide-builder"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
