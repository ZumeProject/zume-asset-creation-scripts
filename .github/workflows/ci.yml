name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest

  pdf-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Typst
        run: |
          set -euo pipefail
          version=0.13.1
          curl -fsSL -o typst.tar.xz \
            "https://github.com/typst/typst/releases/download/v${version}/typst-x86_64-unknown-linux-musl.tar.xz"
          tar -xJf typst.tar.xz
          sudo install -m 755 "typst-x86_64-unknown-linux-musl/typst" /usr/local/bin/typst
          typst --version
      - name: Install Liberation Sans
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation
      - name: Install package
        run: pip install -e .
      - name: Build English 10-session PDF
        run: python -m zume_assets build --lang en --type 10 --targets pdf
      - name: Confirm PDF was written
        run: test -s output/en/Zume-Training-10-Session-en.pdf
